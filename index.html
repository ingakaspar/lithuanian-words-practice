<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; media-src 'self' https://translate.google.com https://translate.googleapis.com data: blob:; connect-src 'self' https://translate.google.com https://translate.googleapis.com; object-src 'none'; base-uri 'none'; frame-ancestors 'none';"
    />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <title>Lithuanian Practice</title>
    <link rel="stylesheet" href="styles.css?v=20260509b" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="mode-dock panel" aria-label="Practice mode">
        <label for="practiceMode">Choose what to practice</label>
        <select id="practiceMode">
          <option value="verbs">Verbs</option>
          <option value="nouns">Noun cases</option>
        </select>
      </aside>
      <main class="app">
      <header class="hero">
        <a
          class="issues-btn"
          href="https://github.com/ingakaspar/lithuanian-words-practice/issues/new"
          target="_blank"
          rel="noopener noreferrer"
          role="button"
          >Bugs &amp; Suggestions</a
        >
        <h1>Lithuanian Practice</h1>
        <p id="dataStats" class="hero-stats"></p>
      </header>

      <section class="panel controls">
        <div class="controls-main">
          <div id="verbControls" class="control-block">
          <label for="formSelect">Verb tense / form</label>
          <select id="formSelect">
            <option value="present">Esamasis</option>
            <option value="past">Būtasis</option>
            <option value="future">Būsimasis</option>
            <option value="usedTo">Būdavo / used to</option>
            <option value="conditional">Sąlyginis (conditional)</option>
            <option value="imperative">Liepiamoji (imperative)</option>
          </select>
        </div>

          <div id="nounControls" class="control-block">
            <label for="nounCaseSelect">Noun case</label>
            <select id="nounCaseSelect">
              <option value="random">All cases (random)</option>
              <option value="Genitive">Genitive</option>
              <option value="Dative">Dative</option>
              <option value="Accusative">Accusative</option>
              <option value="Instrumental">Instrumental</option>
              <option value="Locative">Locative</option>
              <option value="Vocative">Vocative</option>
            </select>
          </div>
        </div>
      </section>

      <section class="panel question" aria-live="polite">
        <div class="question-head">
          <h2 id="promptText">Kraunama…</h2>
          <button id="speakBtn" type="button" class="small-btn" aria-label="Pronounce">
            🔊
          </button>
          <button id="hintBtn" type="button" class="small-btn">Hint</button>
        </div>
        <p id="personText"></p>
        <p id="nounMeta" class="noun-meta"></p>
      </section>

      <section class="panel answer">
        <label for="answerInput">Atsakymas</label>
        <input
          id="answerInput"
          type="text"
          placeholder="Įrašyk formą"
          autocomplete="off"
        />
        <div class="answer-actions">
          <button id="checkBtn" type="button">Check</button>
          <button id="nextBtn" type="button" class="small-btn">Skip</button>
        </div>
        <p id="resultText"></p>
      </section>

      <section class="panel history">
        <h3>Atsakymų istorija</h3>
        <div id="historyList" class="history-list" aria-live="polite"></div>
      </section>
      </main>
    </div>

    <script src="app-config.js"></script>
    <script src="app.js?v=20260509b"></script>
  </body>
</html>
