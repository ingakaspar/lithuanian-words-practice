<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: https:; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; script-src 'self'; media-src 'self' https://translate.google.com https://translate.googleapis.com data: blob:; connect-src 'self' https://translate.google.com https://translate.googleapis.com https://www.googleapis.com https://commons.wikimedia.org; object-src 'none'; base-uri 'none'; frame-ancestors 'none';"
    />
    <meta http-equiv="Referrer-Policy" content="no-referrer" />
    <title>Lithuanian Practice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Serif+Display:ital@0;1&family=Bricolage+Grotesque:opsz,wght@10..48,400;10..48,500;10..48,600;10..48,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=20260608a" />
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" role="img" aria-label="Lithuanian flag"><span></span><span></span><span></span></span>
          <div class="brand-text">
            <span class="brand-title">Lithuanian Practice</span>
            <span class="brand-sub">veiksmažodžiai &amp; linksniai</span>
          </div>
        </div>
        <a
          class="ghost-link"
          href="https://github.com/ingakaspar/lithuanian-words-practice/issues/new"
          target="_blank"
          rel="noopener noreferrer"
          >Report a bug ↗</a
        >
      </header>

      <div class="layout">
        <aside class="sidebar" aria-label="Practice controls">
          <div class="control-group freq-group">
            <div class="freq-head">
              <span class="eyebrow">Difficulty</span>
              <span id="freqHint" class="freq-hint">All groups</span>
            </div>
            <div
              id="freqChips"
              class="freq-chips"
              role="group"
              aria-label="Word frequency band"
              data-all="true"
            ></div>
            <select id="wordGroupSelect" class="visually-hidden" aria-hidden="true" tabindex="-1" multiple>
              <option value="all" selected>All groups (0-900)</option>
            </select>
            <div class="freq-legend" aria-hidden="true">
              <span>common</span>
              <span class="freq-legend-rule"></span>
              <span>rare</span>
            </div>
          </div>

          <div class="control-group">
            <div class="eyebrow">Conjugator</div>
            <div class="seg" role="radiogroup" id="modeSeg">
              <select id="practiceMode" aria-label="Choose what to practice">
                <option value="verbs">Verbs</option>
                <option value="nouns">Nouns</option>
                <option value="pronouns">Pronouns · Местоимения</option>
                <option value="adjectives">Adjectives</option>
                <option value="adverbs">Adverbs</option>
                <option value="numerals">Numerals</option>
              </select>
            </div>
          </div>

          <div id="verbControls" class="control-group">
            <label for="formSelect" class="eyebrow">Tense / form</label>
            <select id="formSelect">
              <option value="random">Random · any tense</option>
              <option value="present">Esamasis · present</option>
              <option value="past">Būtasis · past</option>
              <option value="future">Būsimasis · future</option>
              <option value="usedTo">Būdavo · used to</option>
              <option value="conditional">Sąlyginis · conditional</option>
              <option value="imperative">Liepiamoji · imperative</option>
            </select>
          </div>

          <div id="nounControls" class="control-group">
            <label for="nounCaseSelect" class="eyebrow">Noun case</label>
            <select id="nounCaseSelect">
              <option value="random">All cases (random)</option>
              <option value="Genitive">Genitive · Ko? Kieno?</option>
              <option value="Dative">Dative · Kam?</option>
              <option value="Accusative">Accusative · Ką?</option>
              <option value="Instrumental">Instrumental · Kuo?</option>
              <option value="Locative">Locative · Kur?</option>
              <option value="Vocative">Vocative · Kreipinys</option>
            </select>
          </div>

          <div class="control-group session-group">
            <div class="freq-head">
              <span class="eyebrow">Session</span>
              <button id="resetMasteryBtn" type="button" class="ghost-btn ghost-btn-sm">Reset</button>
            </div>
            <p id="sessionStats" class="session-stats">0 answered · 0% first try · 0 learned now</p>
            <div id="sessionProgress" class="session-progress" hidden>
              <div class="session-bar-track"><div id="sessionBar" class="session-bar-fill"></div></div>
            </div>
            <p id="sessionRegime" class="session-regime"></p>
          </div>

          <p id="dataStats" class="stats"></p>
        </aside>

        <main class="study">
          <section class="card prompt-card" aria-live="polite">
            <div class="prompt-meta">
              <span class="eyebrow" id="promptKicker">Translate &amp; conjugate</span>
              <div class="prompt-actions">
                <button id="speakBtn" type="button" class="icon-btn" aria-label="Pronounce">
                  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path
                      d="M4 9v6h4l5 4V5L8 9H4z"
                      fill="currentColor"
                    />
                    <path
                      d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 5.5a8 8 0 0 1 0 13"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                    />
                  </svg>
                </button>
                <button id="hintBtn" type="button" class="ghost-btn">Hint</button>
              </div>
            </div>

            <figure id="wordImageWrap" class="word-image-wrap" hidden>
              <img id="wordImage" alt="" decoding="async" loading="lazy" />
            </figure>

            <h1 id="promptText" class="prompt-word">Kraunama…</h1>
            <p id="personText" class="prompt-translation"></p>
            <p id="nounMeta" class="prompt-context"></p>
          </section>

          <section class="card answer-card">
            <div class="answer-field" id="answerField" role="group" aria-label="Answer">
              <span id="answerNumTag" class="answer-num-tag" hidden aria-hidden="true"></span>
              <input
                id="answerInput"
                type="text"
                placeholder="Įrašyk formą"
                aria-label="Answer"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <div class="answer-actions">
              <button id="checkBtn" type="button" class="primary-btn">Check answer</button>
              <button id="nextBtn" type="button" class="ghost-btn">Skip →</button>
            </div>
            <p id="resultText" class="result"></p>
          </section>

          <section class="card history-card">
            <header class="history-head">
              <h2>Atsakymų istorija</h2>
              <span class="history-hint">most recent first</span>
            </header>
            <div id="historyList" class="history-list" aria-live="polite"></div>
          </section>
        </main>
      </div>

      <footer class="footer">
        <span>Press <kbd>Enter</kbd> to check · <kbd>Enter</kbd> again for next</span>
      </footer>
    </div>

    <script src="app-config.js"></script>
    <script src="app.js?v=20260608a"></script>
    <script src="frequency-chips.js?v=20260511a"></script>
    <script src="tweaks.js?v=20260511a"></script>
  </body>
</html>
